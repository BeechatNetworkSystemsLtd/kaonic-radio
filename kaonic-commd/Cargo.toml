[package]
name = "kaonic-commd"
version = "0.2.4"
edition = "2024"

[features]
default = ["machine-kaonic1s-us"]
# The same board either way; only the radio driver differs.
# -us: the RF215 driver runs in this process, over spidev.
machine-kaonic1s-us = ["kaonic-radio/machine-kaonic1s-us", "kaonic-ctrl/machine-kaonic1s"]
# -ks: the in-kernel kaonic_rf215 driver owns the chip (netdev).
machine-kaonic1s-ks = ["kaonic-radio/machine-kaonic1s-ks", "kaonic-ctrl/machine-kaonic1s"]
# Kaonic 1X: aliases, as its radio section is the 1S's.
machine-kaonic1x-us = ["machine-kaonic1s-us"]
machine-kaonic1x-ks = ["machine-kaonic1s-ks"]
machine-host = ["kaonic-radio/machine-host", "kaonic-ctrl/machine-host"]

[dependencies]

# Kaonic
radio-rf215 = { path="../radio-rf215/" }
kaonic-radio = { path="../kaonic-radio/", default-features = false }
kaonic-ctrl = { path="../kaonic-ctrl/", default-features = false }
radio-common = { path="../radio-common/" }

rand = { version = "=0.8.5" }

# Logging
env_logger = "0.11.9"
# release_max_level_info compiles out debug!/trace! (and their arg formatting) in release builds.
log = { version = "0.4", features = ["release_max_level_info"] }

# Protobuf and gRPC
tonic = "0.13.0"
prost = "0.13.5"
tokio = { version = "1.0", features = ["macros", "rt", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7.15"

# Additional dependencies
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
tonic-build = "0.13.0"

