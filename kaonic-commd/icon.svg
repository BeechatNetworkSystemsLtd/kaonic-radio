<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7a3f"/><stop offset="1" stop-color="#3e4520"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16200f"/><stop offset="1" stop-color="#0b1208"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c27a"/><stop offset="1" stop-color="#8f6d2c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7d34"/><stop offset="1" stop-color="#8ef08a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe17a"/><stop offset="0.45" stop-color="#f4b62c"/><stop offset="1" stop-color="#f4b62c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="panel"><rect x="104" y="250" width="304" height="150" rx="18"/></clipPath>
  </defs>
  <rect x="48" y="44" width="416" height="416" rx="92" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="48" y="44" width="416" height="208" rx="92" fill="#ffffff" opacity="0.06"/>
  <!-- corner brackets, as on the hub icon -->
  <g stroke="#c9b78a" stroke-width="7" fill="none" opacity="0.85" stroke-linecap="square">
    <path d="M84 116V84h32"/><path d="M428 116V84h-32"/><path d="M84 388v32h32"/><path d="M428 388v32h-32"/>
  </g>
  <!-- spectrum panel -->
  <rect x="98" y="244" width="316" height="162" rx="22" fill="url(#brass)"/>
  <rect x="104" y="250" width="304" height="150" rx="18" fill="url(#screen)"/>
  <g clip-path="url(#panel)">
    <g stroke="#2c4a22" stroke-width="2"><path d="M104 300h304M104 350h304M180 250v150M256 250v150M332 250v150"/></g>
    <g fill="url(#bar)">
      <rect x="122" y="352" width="18" height="38" rx="3"/><rect x="148" y="330" width="18" height="60" rx="3"/>
      <rect x="174" y="310" width="18" height="80" rx="3"/><rect x="200" y="280" width="18" height="110" rx="3"/>
      <rect x="226" y="296" width="18" height="94" rx="3"/><rect x="252" y="268" width="18" height="122" rx="3"/>
      <rect x="278" y="300" width="18" height="90" rx="3"/><rect x="304" y="322" width="18" height="68" rx="3"/>
      <rect x="330" y="340" width="18" height="50" rx="3"/><rect x="356" y="356" width="18" height="34" rx="3"/>
      <rect x="382" y="366" width="14" height="24" rx="3"/>
    </g>
    <path d="M110 392 C 170 380, 210 270, 262 266 S 350 380, 404 384" stroke="#c9f7b0" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
  <!-- mast -->
  <g stroke-linecap="round">
    <path d="M256 236 L 226 168 M256 236 L 286 168 M236 192 L276 192 M231 180 L281 180" stroke="#c9b78a" stroke-width="7" fill="none"/>
    <path d="M256 236 V 120" stroke="#e2c27a" stroke-width="9"/>
  </g>
  <!-- waves -->
  <g fill="none" stroke="#8ef08a" stroke-linecap="round">
    <path d="M222 92 A 48 48 0 0 0 222 148" stroke-width="8" opacity="0.95"/>
    <path d="M290 92 A 48 48 0 0 1 290 148" stroke-width="8" opacity="0.95"/>
    <path d="M196 70 A 80 80 0 0 0 196 170" stroke-width="7" opacity="0.6"/>
    <path d="M316 70 A 80 80 0 0 1 316 170" stroke-width="7" opacity="0.6"/>
  </g>
  <circle cx="256" cy="120" r="30" fill="url(#glow)"/>
  <circle cx="256" cy="120" r="11" fill="#fff4c8"/>
</svg>
